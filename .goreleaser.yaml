version: 2

project_name: hobble

before:
  hooks:
    - go mod tidy

builds:
  - id: hobble
    main: ./cmd/hobble
    binary: hobble
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: hobble
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: hobble
    repository:
      owner: mangrisano
      name: homebrew-hobble
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/mangrisano/hobble"
    description: "A fault-injection reverse proxy for testing client resilience"
    binaries:
      - hobble
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hobble"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: mangrisano
    name: hobble
